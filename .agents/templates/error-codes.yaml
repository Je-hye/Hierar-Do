response_format: "{code: str, message: str, detail: str}"

categories:
  "1xxx": 인증/인가
  "2xxx": 입력 유효성
  "3xxx": 비즈니스 로직
  "4xxx": 외부 서비스
  "5xxx": 시스템 / DB

errors:
  E1001:
    message: Unauthorized
    http: 401
    description: 인증 토큰 없음 또는 만료
    retryable: false
  E2001:
    message: Invalid input
    http: 400
    description: 요청 바디 유효성 실패
    retryable: false
  # 새 에러는 카테고리 순서에 맞게 추가

rules:
  - 5xxx 에러는 detail 필드에 내부 정보 노출 금지 — 로그에만 기록
  - 새 에러 추가 시 이 파일에 먼저 등록 후 구현
